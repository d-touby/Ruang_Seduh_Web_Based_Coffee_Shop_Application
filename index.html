/* ---------------------------------------------------------
   PERSISTENCE HELPERS — thin wrapper around localStorage so
   the rest of the app never touches window.localStorage directly.
--------------------------------------------------------- */
function loadLS(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage full or blocked — fail silently */ }
}

--------------------------------------------------------- */
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts] = useState([]);
  const push = useCallback((msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2400);
  },[]);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap" aria-live="polite">
        {toasts.map(t=> <div className="toast" key={t.id}>{t.msg}</div>)}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

const CartCtx = createContext(null);
function CartProvider({children}){
  const [items,setItems] = useState(()=>loadLS('rs_cart',[]));
  useEffect(()=>saveLS('rs_cart',items),[items]);
  const toast = useToast();
  const add = (line)=>{
    setItems(prev=>{
      const key = JSON.stringify({id:line.id, opts:line.opts});
      const idx = prev.findIndex(p=>JSON.stringify({id:p.id,opts:p.opts})===key);
      if(idx>-1){ const cp=[...prev]; cp[idx]={...cp[idx], qty:cp[idx].qty+line.qty}; return cp; }
      return [...prev, {...line, lineId: Date.now()+Math.random()}];
    });
    if(toast) toast(`${line.name} ditambahkan ke keranjang`);
  };
  const updateQty = (lineId, qty)=> setItems(prev=> qty<=0 ? prev.filter(p=>p.lineId!==lineId) : prev.map(p=>p.lineId===lineId?{...p,qty}:p));
  const remove = (lineId)=> setItems(prev=>prev.filter(p=>p.lineId!==lineId));
  const clear = ()=> setItems([]);
  const subtotal = useMemo(()=>items.reduce((s,i)=>s+i.unitPrice*i.qty,0),[items]);
  const count = useMemo(()=>items.reduce((s,i)=>s+i.qty,0),[items]);
  return <CartCtx.Provider value={{items,add,updateQty,remove,clear,subtotal,count}}>{children}</CartCtx.Provider>;
}
const useCart = ()=> useContext(CartCtx);

const WishCtx = createContext(null);
function WishProvider({children}){
  const [ids,setIds] = useState(()=>loadLS('rs_wishlist',[]));
  useEffect(()=>saveLS('rs_wishlist',ids),[ids]);

  const toggle = (id)=> setIds(prev=>{

    if(toast) toast('Ditambahkan ke favorit');
    return [...prev,id];

}
const useWish = ()=> useContext(WishCtx);

const UserCtx = createContext(null);
function UserProvider({children}){
  const [user,setUser] = useState(()=>loadLS('rs_user',null));
  const [orders,setOrders] = useState(()=>loadLS('rs_orders',[]));
  useEffect(()=>saveLS('rs_user',user),[user]);
  useEffect(()=>saveLS('rs_orders',orders),[orders]);
  const login = (email,name)=> setUser({email,name: name || email.split('@')[0], joined:new Date().toISOString(), address:''});
  const register = (name,email)=> setUser({email,name,joined:new Date().toISOString(), address:''});
  const logout = ()=> setUser(null);
  const updateProfile = (patch)=> setUser(u=> u?{...u,...patch}:u);
  const addOrder = (order)=> setOrders(prev=>[order,...prev]);
  const advanceOrder = (id)=> setOrders(prev=>prev.map(o=> o.id===id ? {...o, statusIdx: Math.min(o.statusIdx+1,3)} : o));
  return <UserCtx.Provider value={{user,login,register,logout,updateProfile,orders,addOrder,advanceOrder}}>{children}</UserCtx.Provider>;
}
const useUser = ()=> useContext(UserCtx);

/* ---------------------------------------------------------
   ROUTER — tiny hash router: #/menu, #/product/3, #/blog/2 ...
--------------------------------------------------------- */
function useRoute(){
  const parse = ()=>{
    const h = window.location.hash.replace(/^#\/?/,'') || 'home';
    const [page, param] = h.split('/');
    return {page: page||'home', param};
  };
  const [route,setRoute] = useState(parse);
  useEffect(()=>{
    const onHash = ()=>{ setRoute(parse()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  return route;
}
const go = (path)=>{ window.location.hash = path; };

function Stars({rating}){
  const full = Math.round(rating);
  return (
    <span style={{display:'inline-flex',gap:2,color:'var(--accent)'}} aria-label={`Rating ${rating} dari 5`}>
      {[1,2,3,4,5].map(i=> <span key={i} style={{opacity:i<=full?1:.25}}><Icon name="star" size={14}/></span>)}
    </span>
  );
}

function Badge({children,type}){
  return <span className={`badge badge-${type}`}>{children}</span>;
}

function Modal({title, onClose, children, wide}){
  useEffect(()=>{
    const onKey = e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow='hidden';
    return ()=>{document.removeEventListener('keydown', onKey); document.body.style.overflow='';};
  },[onClose]);
  return (
    <div role="dialog" aria-modal="true" aria-label={title} style={{position:'fixed',inset:0,background:'rgba(20,15,12,0.5)',zIndex:150,display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onClose}>
      <div className="card" style={{width:'100%',maxWidth:wide?640:460,maxHeight:'88vh',overflowY:'auto',borderBottomLeftRadius:0,borderBottomRightRadius:0,padding:22,animation:'none'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <h3 style={{margin:0,fontSize:20}}>{title}</h3>
          <button className="btn-ghost btn" aria-label="Tutup" onClick={onClose}><Icon name="close" size={18}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function EmptyState({icon,title,desc,action}){

function ProductVisual({product,size=1}){
  const hues = {coffee:'#5B3A29,#8A5A3A',non_coffee:'#8A9A73,#5F6E48','non-coffee':'#8A9A73,#5F6E48',tea:'#7A8F6B,#4C5D3E',pastry:'#C99A5B,#8C5E2E',dessert:'#B5651D,#7A3E12',snacks:'#A9713C,#6E4423'};

  const [c1,c2] = g.split(',');
  return (
    <div aria-hidden="true" style={{
      background:`linear-gradient(135deg, ${c1}, ${c2})`,

/* ---------------------------------------------------------

--------------------------------------------------------- */
function ProductCard({product}){
  const cart = useCart(); const wish = useWish();
  const isFav = wish.ids.includes(product.id);
  const finalPrice = product.discount ? Math.round(product.price*(1-product.discount/100)) : product.price;
  const quickAdd = (e)=>{
    e.preventDefault();
    cart.add({id:product.id,name:product.name,unitPrice:finalPrice,qty:1,opts:{size:'Regular'}, image:product.category});
  };
  return (
    <a href={`#/product/${product.id}`} className="card" style={{padding:12,display:'flex',flexDirection:'column',gap:10,position:'relative'}}>
      <button onClick={(e)=>{e.preventDefault();wish.toggle(product.id);}} aria-label={isFav?'Hapus dari favorit':'Tambah ke favorit'}
        style={{position:'absolute',top:20,right:20,zIndex:2,background:'var(--surface)',border:'1px solid var(--line)',borderRadius:99,width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',color:isFav?'var(--danger)':'var(--text-muted)',cursor:'pointer'}}>
        <Icon name="heart" size={15}/>
      </button>
      <ProductVisual product={product}/>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',minHeight:20}}>
        {product.isBestSeller && <Badge type="best">Best Seller</Badge>}
        {product.isNew && <Badge type="new">Baru</Badge>}
        {product.discount>0 && <Badge type="off">-{product.discount}%</Badge>}
      </div>
      <div style={{fontWeight:600,fontSize:15,lineHeight:1.3}}>{product.name}</div>
      <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,color:'var(--text-muted)'}}>
        <Stars rating={product.rating}/> <span>({product.reviews})</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'auto'}}>
        <div>
          {product.discount>0 && <div style={{fontSize:12,color:'var(--text-muted)',textDecoration:'line-through'}}>{fmtRp(product.price)}</div>}
          <div style={{fontWeight:700,color:'var(--brand)'}}>{fmtRp(finalPrice)}</div>
        </div>
        <button onClick={quickAdd} className="btn btn-primary btn-sm" aria-label={`Tambah ${product.name} ke keranjang`}><Icon name="plus" size={14}/></button>
      </div>
    </a>
  );
}

function Menu({search,setSearch}){
  const [cat,setCat] = useState('all');
  const [sort,setSort] = useState('pop');
  let list = PRODUCTS.filter(p=> (cat==='all'||p.category===cat) && p.name.toLowerCase().includes(search.toLowerCase()));
  if(sort==='price-asc') list = [...list].sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') list = [...list].sort((a,b)=>b.price-a.price);
  if(sort==='rating') list = [...list].sort((a,b)=>b.rating-a.rating);
  return (
    <div className="wrap" style={{padding:'32px 20px 60px'}}>
      <h1 style={{fontSize:32,marginBottom:6}}>Menu Kami</h1>
      <p style={{color:'var(--text-muted)',marginBottom:24}}>{list.length} produk ditemukan</p>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <div className="scrollx" style={{flex:1,paddingBottom:0}}>
          {[{id:'all',label:'Semua',icon:'✨'},...CATS].map(c=>(
            <button key={c.id} onClick={()=>setCat(c.id)} className="btn btn-sm" style={{flexShrink:0,
              background: cat===c.id ? 'var(--brand)':'var(--surface)', color: cat===c.id?'#fff':'var(--text)', border:'1px solid var(--line)'}}>
              <span style={{marginRight:6}}>{c.icon}</span>{c.label}
            </button>
          ))}
        </div>
        <select aria-label="Urutkan" value={sort} onChange={e=>setSort(e.target.value)} style={{padding:'9px 12px',borderRadius:10,border:'1px solid var(--line)',background:'var(--surface)',color:'var(--text)',flexShrink:0}}>
          <option value="pop">Paling Populer</option>
          <option value="price-asc">Harga Terendah</option>
          <option value="price-desc">Harga Tertinggi</option>
          <option value="rating">Rating Tertinggi</option>
        </select>
      </div>
      {list.length===0 ? (
        <EmptyState icon="🔍" title="Produk tidak ditemukan" desc={`Tidak ada hasil untuk "${search}". Coba kata kunci atau kategori lain.`}
          action={<button className="btn btn-outline" onClick={()=>{setSearch('');setCat('all');}}>Reset Pencarian</button>}/>
      ) : (
        <div className="grid-products">{list.map(p=><ProductCard key={p.id} product={p}/>)}</div>
      )}
    </div>
  );
}

  const [qty,setQty] = useState(1);
  const [note,setNote] = useState('');

  if(!product) return <EmptyState icon="😕" title="Produk tidak ditemukan" desc="Produk ini mungkin sudah tidak tersedia." action={<a href="#/menu" className="btn btn-primary">Kembali ke Menu</a>}/>;

  const isDrink = product.category!=='pastry' && product.category!=='dessert' && product.category!=='snacks';
  const base = product.discount ? Math.round(product.price*(1-product.discount/100)) : product.price;
  const sizeAdd = SIZE_OPTS.find(s=>s.id===size).add;
  const topAdd = toppings.reduce((s,t)=>s+TOPPING_OPTS.find(o=>o.id===t).add,0);
  const unit = base + (isDrink?sizeAdd:0) + (isDrink?topAdd:0);
  const total = unit*qty;

  const toggleTop = (id)=> setToppings(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev,id]);

  const addToCart = ()=>{
    const opts = isDrink ? {
      size: SIZE_OPTS.find(s=>s.id===size).label, temp: TEMP_OPTS.find(t=>t.id===temp).label,
      sugar: `Gula ${SUGAR_OPTS.find(s=>s.id===sugar).label}`, ice: `Es ${ICE_OPTS.find(i=>i.id===ice).label}`,
      toppings: toppings.map(t=>TOPPING_OPTS.find(o=>o.id===t).label), note
    } : { note };
    cart.add({id:product.id,name:product.name,unitPrice:unit,qty,opts,image:product.category});
  };

  return (
    <div className="wrap" style={{padding:'32px 20px 60px'}}>
      <a href="#/menu" className="btn btn-ghost btn-sm" style={{marginBottom:16}}><Icon name="chevRight" size={14}/> Kembali</a>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:40}} className="pd-grid">
        <div style={{position:'sticky',top:90,alignSelf:'flex-start'}}>
          <ProductVisual product={product} size={2.2}/>
        </div>
        <div>
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            {product.isBestSeller && <Badge type="best">Best Seller</Badge>}
            {product.isNew && <Badge type="new">Baru</Badge>}
            {product.discount>0 && <Badge type="off">-{product.discount}%</Badge>}
          </div>
          <h1 style={{fontSize:30,margin:'0 0 8px'}}>{product.name}</h1>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,fontSize:14,color:'var(--text-muted)'}}>
            <Stars rating={product.rating}/> {product.rating} · {product.reviews} ulasan · {catLabel(product.category)}
          </div>
          <p style={{color:'var(--text-muted)',lineHeight:1.6,marginBottom:18}}>{product.desc}</p>
          <div style={{fontSize:26,fontWeight:700,color:'var(--brand)',marginBottom:22}}>{fmtRp(unit)}</div>

          {isDrink && (
            <>
              <OptionGroup label="Ukuran" opts={SIZE_OPTS} value={size} onChange={setSize} priceKey="add"/>
              <OptionGroup label="Suhu" opts={TEMP_OPTS} value={temp} onChange={setTemp}/>
              <OptionGroup label="Level Gula" opts={SUGAR_OPTS} value={sugar} onChange={setSugar}/>
              <OptionGroup label="Level Es" opts={ICE_OPTS} value={ice} onChange={setIce}/>
              <div style={{marginBottom:20}}>
                <label style={{display:'block',fontSize:13,fontWeight:600,marginBottom:8}}>Tambahan (opsional)</label>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  {TOPPING_OPTS.map(t=>(
                    <button key={t.id} onClick={()=>toggleTop(t.id)} className="btn btn-sm" style={{border:'1px solid var(--line)',
                      background: toppings.includes(t.id)?'var(--brand)':'var(--surface)', color: toppings.includes(t.id)?'#fff':'var(--text)'}}>
                      {t.label} (+{fmtRp(t.add)})
                    </button>
                  ))}
                </div>
              </div>
            </>
          )}

          <div className="field" style={{marginBottom:22}}>
            <label htmlFor="note">Catatan khusus</label>
            <textarea id="note" rows="2" placeholder="Contoh: tolong gulanya dipisah" value={note} onChange={e=>setNote(e.target.value)}/>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:22}}>
            <span style={{fontWeight:600,fontSize:14}}>Jumlah</span>
            <div style={{display:'flex',alignItems:'center',border:'1px solid var(--line)',borderRadius:999}}>
              <button className="btn btn-ghost" aria-label="Kurangi jumlah" onClick={()=>setQty(q=>Math.max(1,q-1))}><Icon name="minus" size={14}/></button>
              <span style={{minWidth:24,textAlign:'center',fontWeight:600}}>{qty}</span>
              <button className="btn btn-ghost" aria-label="Tambah jumlah" onClick={()=>setQty(q=>q+1)}><Icon name="plus" size={14}/></button>
            </div>
          </div>

          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={()=>{addToCart();}}>Tambah ke Keranjang — {fmtRp(total)}</button>
            <button className="btn btn-outline" aria-label="Tambah ke favorit" onClick={()=>wish.toggle(product.id)} style={{color: wish.ids.includes(product.id)?'var(--danger)':'var(--text)'}}>
              <Icon name="heart" size={18}/>
            </button>
          </div>
        </div>
      </div>
      <style>{`@media (max-width:800px){ .pd-grid{grid-template-columns:1fr !important;} }`}</style>
    </div>
  );
}
function OptionGroup({label,opts,value,onChange,priceKey}){
  return (
    <div style={{marginBottom:18}}>
      <label style={{display:'block',fontSize:13,fontWeight:600,marginBottom:8}}>{label}</label>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {opts.map(o=>(
          <button key={o.id} onClick={()=>onChange(o.id)} className="btn btn-sm" style={{border:'1px solid var(--line)',
            background: value===o.id?'var(--brand)':'var(--surface)', color: value===o.id?'#fff':'var(--text)'}}>
            {o.label}{priceKey && o[priceKey]>0 ? ` (+${fmtRp(o[priceKey])})` : ''}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   CHECKOUT PAGE
--------------------------------------------------------- */
function Checkout(){
  const cart = useCart(); const {user,addOrder} = useUser(); const toast = useToast();
  const [form,setForm] = useState({name:user?.name||'',phone:'',email:user?.email||'',orderType:'dine-in',address:'',notes:'',payment:'cash'});
  const [errors,setErrors] = useState({});
  const tax = Math.round(cart.subtotal*0.05);
  const deliveryFee = form.orderType==='delivery' ? 8000 : 0;
  const grandTotal = cart.subtotal+tax+deliveryFee;

  if(cart.items.length===0){
    return <div className="wrap" style={{padding:'40px 20px 60px'}}>
      <EmptyState icon="🧾" title="Belum ada pesanan" desc="Keranjangmu kosong, tambahkan menu dulu sebelum checkout." action={<a href="#/menu" className="btn btn-primary">Lihat Menu</a>}/>
    </div>;
  }

  const set = (k,v)=> setForm(f=>({...f,[k]:v}));

  const validate = ()=>{
    const e = {};
    if(!form.name.trim()) e.name='Nama wajib diisi';
    if(!/^\d{8,15}$/.test(form.phone.replace(/\D/g,''))) e.phone='Nomor telepon tidak valid';
    if(!/^\S+@\S+\.\S+$/.test(form.email)) e.email='Email tidak valid';
    if(form.orderType==='delivery' && !form.address.trim()) e.address='Alamat wajib diisi untuk pengantaran';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const submit = (e)=>{
    e.preventDefault();
    if(!validate()){ toast('Periksa kembali data yang belum lengkap'); return; }
    const order = {
      id: 'RS-'+Date.now().toString().slice(-6),
      items: cart.items, subtotal: cart.subtotal, tax, deliveryFee, total: grandTotal,
      orderType: form.orderType, payment: form.payment, customer:{name:form.name,phone:form.phone,email:form.email,address:form.address},
      notes: form.notes, statusIdx: 0, createdAt: new Date().toISOString(), eta: form.orderType==='delivery' ? '35-45 menit' : '10-15 menit',
    };
    addOrder(order);
    cart.clear();
    toast('Pesanan berhasil dibuat!');
    go(`tracking/${order.id}`);
  };

  return (
    <div className="wrap" style={{padding:'32px 20px 60px',display:'grid',gridTemplateColumns:'1.5fr 1fr',gap:30}}>
      <form onSubmit={submit}>
        <h1 style={{fontSize:28,marginBottom:20}}>Checkout</h1>
        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Informasi Pelanggan</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div className={`field ${errors.name?'has-err':''}`}>
              <label htmlFor="c-name">Nama</label>
              <input id="c-name" value={form.name} onChange={e=>set('name',e.target.value)}/>
              {errors.name && <div className="err">{errors.name}</div>}
            </div>
            <div className={`field ${errors.phone?'has-err':''}`}>
              <label htmlFor="c-phone">No. Telepon</label>
              <input id="c-phone" value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="08xxxxxxxxxx"/>
              {errors.phone && <div className="err">{errors.phone}</div>}
            </div>
          </div>
          <div className={`field ${errors.email?'has-err':''}`} style={{marginTop:14}}>
            <label htmlFor="c-email">Email</label>
            <input id="c-email" type="email" value={form.email} onChange={e=>set('email',e.target.value)}/>
            {errors.email && <div className="err">{errors.email}</div>}
          </div>
        </div>

        <div className="card" style={{padding:20,marginBottom:18}}>
          <h3 style={{marginTop:0}}>Tipe Pesanan</h3>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {[['dine-in','Dine In'],['take-away','Take Away'],['delivery','Delivery']].map(([id,label])=>(
              <button type="button" key={id} onClick={()=>set('orderType',id)} className="btn btn-sm" style={{border:'1px solid var(--line)',
                background:form.orderType===id?'var(--brand)':'var(--surface)', color:form.orderType===id?'#fff':'var(--text)'}}>{label}</button>
            ))}
          </div>
          {form.orderType==='delivery' && (
            <div style={{marginTop:16}}>
              <div className={`field ${errors.address?'has-err':''}`}>
                <label htmlFor="c-addr">Alamat Pengantaran</label>
                <textarea id="c-addr" rows="2" value={form.address} onChange={e=>set('address',e.target.value)}/>
                {errors.address && <div className="err">{errors.address}</div>}
              </div>
              <div className="field" style={{marginTop:10}}>
                <label htmlFor="c-note">Catatan Alamat</label>
                <input id="c-note" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Patokan rumah, warna pagar, dll"/>
              </div>
            </div>
          )}
        </div>

        <div className="card" style={{padding:20}}>
          <h3 style={{marginTop:0}}>Metode Pembayaran</h3>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:-8,marginBottom:14}}>Pembayaran di situs ini hanya simulasi, tidak ada transaksi nyata.</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {[['cash','💵 Cash'],['qris','📱 QRIS'],['ewallet','💳 E-Wallet'],['transfer','🏦 Transfer Bank']].map(([id,label])=>(
              <button type="button" key={id} onClick={()=>set('payment',id)} className="btn btn-sm" style={{border:'1px solid var(--line)',justifyContent:'flex-start',
                background:form.payment===id?'var(--brand)':'var(--surface)', color:form.payment===id?'#fff':'var(--text)'}}>{label}</button>
            ))}
          </div>
        </div>
      </form>

      <div className="card" style={{padding:22,height:'fit-content',position:'sticky',top:90}}>
        <h3 style={{marginTop:0}}>Ringkasan Pesanan</h3>
        {cart.items.map(i=> <SummaryRow key={i.lineId} label={`${i.qty}× ${i.name}`} value={fmtRp(i.unitPrice*i.qty)}/>)}
        <div style={{borderTop:'1px solid var(--line)',margin:'10px 0'}}/>
        <SummaryRow label="Subtotal" value={fmtRp(cart.subtotal)}/>
        <SummaryRow label="Pajak" value={fmtRp(tax)}/>
        <SummaryRow label="Biaya Antar" value={deliveryFee===0?'Gratis':fmtRp(deliveryFee)}/>
        <div style={{borderTop:'1px solid var(--line)',margin:'10px 0'}}/>
        <SummaryRow label="Total" value={fmtRp(grandTotal)} bold/>
        <button onClick={submit} className="btn btn-primary btn-full" style={{marginTop:16}}>Buat Pesanan</button>
      </div>
    </div>
  );
}

   ORDER TRACKING
--------------------------------------------------------- */
const STATUS_STEPS = ['Pesanan Diterima','Sedang Disiapkan','Siap Diambil/Diantar','Selesai'];
function Tracking({id}){
  const {orders,advanceOrder} = useUser();
  const order = orders.find(o=>o.id===id);
  if(!order) return <div className="wrap" style={{padding:'40px 20px 60px'}}>
    <EmptyState icon="🔎" title="Pesanan tidak ditemukan" desc="Cek kembali nomor pesananmu atau lihat riwayat di profil." action={<a href="#/profile" className="btn btn-primary">Lihat Riwayat</a>}/>
  </div>;
  return (
    <div className="wrap" style={{padding:'32px 20px 60px',maxWidth:640}}>
      <h1 style={{fontSize:26,marginBottom:4}}>Lacak Pesanan</h1>
      <p style={{color:'var(--text-muted)',marginBottom:24}}>ID Pesanan: <strong>{order.id}</strong> · Estimasi {order.eta}</p>
      <div className="card" style={{padding:24,marginBottom:20}}>
        {STATUS_STEPS.map((s,idx)=>(
          <div key={s} style={{display:'flex',gap:14,paddingBottom: idx<STATUS_STEPS.length-1?24:0,position:'relative'}}>
            {idx<STATUS_STEPS.length-1 && <div style={{position:'absolute',left:11,top:26,width:2,height:'calc(100% - 10px)',background: idx<order.statusIdx?'var(--brand)':'var(--line)'}}/>}
            <div style={{width:24,height:24,borderRadius:99,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
              background: idx<=order.statusIdx?'var(--brand)':'var(--surface-2)', color: idx<=order.statusIdx?'#fff':'var(--text-muted)',border: idx<=order.statusIdx?'none':'1px solid var(--line)'}}>
              {idx<order.statusIdx ? <Icon name="check" size={13}/> : <span style={{fontSize:11,fontWeight:700}}>{idx+1}</span>}
            </div>
            <div>
              <div style={{fontWeight: idx===order.statusIdx?700:500,color: idx<=order.statusIdx?'var(--text)':'var(--text-muted)'}}>{s}</div>
              {idx===order.statusIdx && <div style={{fontSize:12.5,color:'var(--text-muted)'}}>Status saat ini</div>}
            </div>
          </div>
        ))}
        {order.statusIdx<3 && (
          <button className="btn btn-outline btn-sm" style={{marginTop:18}} onClick={()=>advanceOrder(order.id)}>
            Simulasikan status berikutnya
          </button>
        )}
      </div>
      <div className="card" style={{padding:20}}>
        <h3 style={{marginTop:0}}>Ringkasan Pesanan</h3>
        {order.items.map((i,idx)=><SummaryRow key={idx} label={`${i.qty}× ${i.name}`} value={fmtRp(i.unitPrice*i.qty)}/>)}
        <div style={{borderTop:'1px solid var(--line)',margin:'10px 0'}}/>
        <SummaryRow label="Total" value={fmtRp(order.total)} bold/>
      </div>
    </div>
  );
}

          style={{width:'100%',padding:'10px 12px 10px 34px',borderRadius:10,border:'1px solid var(--line)',background:'var(--surface)',color:'var(--text)'}}/>
      </div>
      {list.length===0 ? <EmptyState icon="📰" title="Artikel tidak ditemukan" desc="Coba kata kunci lain."/> : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}} className="blog-grid">
          {list.map(a=>(
            <a key={a.id} href={`#/blog/${a.id}`} className="card" style={{padding:18,display:'flex',flexDirection:'column',gap:8}}>
              <span style={{fontSize:12,fontWeight:700,color:'var(--accent)'}}>{a.cat}</span>
              <h3 style={{margin:'2px 0',fontSize:17,lineHeight:1.3}}>{a.title}</h3>
              <p style={{color:'var(--text-muted)',fontSize:13.5,margin:0}}>{a.excerpt}</p>
              <div style={{fontSize:12,color:'var(--text-muted)',marginTop:'auto',paddingTop:8}}>{a.date} · {a.read} baca</div>
            </a>
          ))}
        </div>
      )}
      <style>{`@media (max-width:800px){ .blog-grid{grid-template-columns:1fr 1fr !important;} } @media (max-width:520px){ .blog-grid{grid-template-columns:1fr !important;} }`}</style>
    </div>
  );
}
function BlogDetail({id}){
  const a = ARTICLES.find(x=>x.id===Number(id));
  if(!a) return <EmptyState icon="📰" title="Artikel tidak ditemukan" desc="Artikel ini mungkin sudah dipindahkan." action={<a href="#/blog" className="btn btn-primary">Kembali ke Artikel</a>}/>;
  return (
    <div className="wrap" style={{padding:'32px 20px 60px',maxWidth:680}}>
      <a href="#/blog" className="btn btn-ghost btn-sm" style={{marginBottom:16}}>← Kembali ke Artikel</a>
      <span style={{fontSize:12,fontWeight:700,color:'var(--accent)'}}>{a.cat}</span>
      <h1 style={{fontSize:30,margin:'8px 0 10px'}}>{a.title}</h1>
      <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:22}}>{a.date} · {a.read} baca</div>
      <p style={{lineHeight:1.8,fontSize:16,color:'var(--text)'}}>{a.body}</p>
    </div>
  );
}

/* ---------------------------------------------------------
   REVIEWS PAGE
--------------------------------------------------------- */
function ReviewsPage(){
  const [reviews,setReviews] = useState(()=>loadLS('rs_reviews', REVIEW_SEED));
  useEffect(()=>saveLS('rs_reviews',reviews),[reviews]);
  const [form,setForm] = useState({name:'',rating:5,text:''});
  const toast = useToast();
  const submit = e=>{
    e.preventDefault();
    if(!form.name.trim()||!form.text.trim()){ toast('Lengkapi nama dan ulasan terlebih dahulu'); return; }
    setReviews(r=>[{id:Date.now(),name:form.name,rating:form.rating,text:form.text,date:new Date().toISOString().slice(0,10)},...r]);
    setForm({name:'',rating:5,text:''});
    toast('Terima kasih atas ulasannya!');
  };
  const avg = (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1);
  return (
    <div className="wrap" style={{padding:'32px 20px 60px',display:'grid',gridTemplateColumns:'1fr 1.3fr',gap:34}} >
      <div>
        <h1 style={{fontSize:28,marginBottom:6}}>Ulasan Pelanggan</h1>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
          <span style={{fontSize:28,fontWeight:700}}>{avg}</span><Stars rating={Number(avg)}/><span style={{color:'var(--text-muted)',fontSize:13.5}}>({reviews.length} ulasan)</span>
        </div>
        <form onSubmit={submit} className="card" style={{padding:18}}>
          <h3 style={{marginTop:0,fontSize:16}}>Tulis Ulasan</h3>
          <div className="field" style={{marginBottom:10}}>
            <label htmlFor="rv-name">Nama</label>
            <input id="rv-name" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          </div>
          <div className="field" style={{marginBottom:10}}>
            <label htmlFor="rv-rating">Rating</label>
            <select id="rv-rating" value={form.rating} onChange={e=>setForm(f=>({...f,rating:Number(e.target.value)}))}>
              {[5,4,3,2,1].map(n=><option key={n} value={n}>{n} bintang</option>)}
            </select>
          </div>
          <div className="field" style={{marginBottom:14}}>
            <label htmlFor="rv-text">Ulasan</label>
            <textarea id="rv-text" rows="3" value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))}/>
          </div>
          <button className="btn btn-primary btn-full" type="submit">Kirim Ulasan</button>
        </form>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,paddingTop: window.innerWidth>800 ? 62 : 0}}>
        {reviews.map(r=>(
          <div key={r.id} className="card" style={{padding:16,display:'flex',gap:12}}>
            <div style={{width:38,height:38,borderRadius:99,background:'var(--brand)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,flexShrink:0}}>{r.name[0].toUpperCase()}</div>
            <div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}><strong>{r.name}</strong><span style={{fontSize:12,color:'var(--text-muted)'}}>{r.date}</span></div>
              <Stars rating={r.rating}/>
              <p style={{margin:'6px 0 0',fontSize:14.5,color:'var(--text)'}}>{r.text}</p>
            </div>
          </div>
        ))}
      </div>
      <style>{`@media (max-width:800px){ .wrap > div[style*="grid-template-columns: 1fr 1.3fr"]{display:block;} }`}</style>
    </div>
  );
}

/* ---------------------------------------------------------
   AUTH PAGES
--------------------------------------------------------- */
function Login(){
  const {login} = useUser(); const toast = useToast();
  const [email,setEmail] = useState(''); const [pass,setPass] = useState(''); const [err,setErr] = useState('');
  const submit = e=>{
    e.preventDefault();
    if(!/^\S+@\S+\.\S+$/.test(email)){ setErr('Format email tidak valid'); return; }
    if(pass.length<4){ setErr('Kata sandi minimal 4 karakter'); return; }
    login(email); toast('Berhasil masuk!'); go('profile');
  };
  return (
    <div className="wrap" style={{padding:'50px 20px 70px',maxWidth:400}}>
      <h1 style={{fontSize:28,marginBottom:4}}>Masuk</h1>
      <p style={{color:'var(--text-muted)',marginBottom:24,fontSize:14}}>Simulasi login — tidak ada data yang benar-benar diverifikasi ke server.</p>
      <form onSubmit={submit} className="card" style={{padding:22}}>
        <div className="field" style={{marginBottom:14}}>
          <label htmlFor="lg-email">Email</label>
          <input id="lg-email" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
        </div>
        <div className="field" style={{marginBottom:8}}>
          <label htmlFor="lg-pass">Kata Sandi</label>
          <input id="lg-pass" type="password" value={pass} onChange={e=>setPass(e.target.value)}/>
        </div>
        {err && <div className="err" style={{marginBottom:10}}>{err}</div>}
        <a href="#/forgot" style={{fontSize:13,color:'var(--accent)',display:'block',marginBottom:16}}>Lupa kata sandi?</a>
        <button className="btn btn-primary btn-full" type="submit">Masuk</button>
        <p style={{textAlign:'center',fontSize:13.5,marginTop:16}}>Belum punya akun? <a href="#/register" style={{color:'var(--accent)',fontWeight:600}}>Daftar</a></p>
      </form>
    </div>
  );
}
function Register(){
  const {register} = useUser(); const toast = useToast();
  const [form,setForm] = useState({name:'',email:'',pass:''}); const [err,setErr] = useState('');
  const submit = e=>{
    e.preventDefault();
    if(!form.name.trim()){ setErr('Nama wajib diisi'); return; }
    if(!/^\S+@\S+\.\S+$/.test(form.email)){ setErr('Format email tidak valid'); return; }
    if(form.pass.length<4){ setErr('Kata sandi minimal 4 karakter'); return; }
    register(form.name,form.email); toast('Akun berhasil dibuat!'); go('profile');
  };
  return (
    <div className="wrap" style={{padding:'50px 20px 70px',maxWidth:400}}>
      <h1 style={{fontSize:28,marginBottom:4}}>Buat Akun</h1>
      <p style={{color:'var(--text-muted)',marginBottom:24,fontSize:14}}>Simulasi pendaftaran untuk keperluan demo.</p>
      <form onSubmit={submit} className="card" style={{padding:22}}>
        <div className="field" style={{marginBottom:14}}>
          <label htmlFor="rg-name">Nama Lengkap</label>
          <input id="rg-name" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
        </div>
        <div className="field" style={{marginBottom:14}}>
          <label htmlFor="rg-email">Email</label>
          <input id="rg-email" type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
        </div>
        <div className="field" style={{marginBottom:8}}>
          <label htmlFor="rg-pass">Kata Sandi</label>
          <input id="rg-pass" type="password" value={form.pass} onChange={e=>setForm(f=>({...f,pass:e.target.value}))}/>
        </div>
        {err && <div className="err" style={{marginBottom:10}}>{err}</div>}
        <button className="btn btn-primary btn-full" style={{marginTop:8}} type="submit">Daftar</button>
        <p style={{textAlign:'center',fontSize:13.5,marginTop:16}}>Sudah punya akun? <a href="#/login" style={{color:'var(--accent)',fontWeight:600}}>Masuk</a></p>
      </form>
    </div>
  );
}
function Forgot(){
  const [email,setEmail] = useState(''); const [sent,setSent] = useState(false);
  return (
    <div className="wrap" style={{padding:'50px 20px 70px',maxWidth:400}}>
      <h1 style={{fontSize:28,marginBottom:4}}>Lupa Kata Sandi</h1>
      <p style={{color:'var(--text-muted)',marginBottom:24,fontSize:14}}>Simulasi — tidak ada email sungguhan yang dikirim.</p>
      <div className="card" style={{padding:22}}>
        {sent ? (
          <EmptyState icon="📩" title="Instruksi terkirim (simulasi)" desc={`Jika ${email} terdaftar, kami akan mengirim tautan reset.`} action={<a href="#/login" className="btn btn-primary">Kembali ke Login</a>}/>
        ) : (
          <form onSubmit={e=>{e.preventDefault(); if(email) setSent(true);}}>
            <div className="field" style={{marginBottom:16}}>
              <label htmlFor="fg-email">Email terdaftar</label>
              <input id="fg-email" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/>
            </div>
            <button className="btn btn-primary btn-full" type="submit">Kirim Instruksi</button>
          </form>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   PROFILE
--------------------------------------------------------- */
function Profile(){
  const {user,logout,orders,updateProfile} = useUser(); const toast = useToast();
  const wish = useWish();
  const [tab,setTab] = useState('orders');
  const [address,setAddress] = useState(user?.address||'');

  if(!user){
    return <div className="wrap" style={{padding:'40px 20px 60px'}}>
      <EmptyState icon="👤" title="Kamu belum masuk" desc="Masuk untuk melihat profil, riwayat pesanan, dan favoritmu." action={<a href="#/login" className="btn btn-primary">Masuk Sekarang</a>}/>
    </div>;
  }
  const myOrders = orders.filter(o=>o.customer && o.customer.email===user.email || !o.customer);
  const points = orders.length*10;
  const favProducts = PRODUCTS.filter(p=>wish.ids.includes(p.id));

  return (
    <div className="wrap" style={{padding:'32px 20px 60px'}}>
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:26,flexWrap:'wrap'}}>
        <div style={{width:64,height:64,borderRadius:99,background:'var(--brand)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:700}}>{user.name[0].toUpperCase()}</div>
        <div style={{flex:1}}>
          <h1 style={{fontSize:24,margin:0}}>{user.name}</h1>
          <p style={{color:'var(--text-muted)',margin:'2px 0 0',fontSize:14}}>{user.email}</p>
        </div>
        <span className="badge badge-best">Member · {points} poin</span>
        <button className="btn btn-outline btn-sm" onClick={()=>{logout();toast('Berhasil keluar');go('home');}}>Keluar</button>
      </div>
      <div style={{display:'flex',gap:6,borderBottom:'1px solid var(--line)',marginBottom:22,flexWrap:'wrap'}}>
        {[['orders','Riwayat Pesanan'],['favorites','Favorit'],['profile','Info Akun']].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} className="btn btn-ghost btn-sm" style={{borderBottom: tab===id?'2px solid var(--brand)':'2px solid transparent',borderRadius:0,color:tab===id?'var(--text)':'var(--text-muted)',fontWeight:tab===id?700:500}}>{label}</button>
        ))}
      </div>

      {tab==='orders' && (
        myOrders.length===0 ? <EmptyState icon="🧾" title="Belum ada pesanan" desc="Riwayat pesananmu akan muncul di sini." action={<a href="#/menu" className="btn btn-primary">Mulai Pesan</a>}/> : (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {myOrders.map(o=>(
              <a key={o.id} href={`#/tracking/${o.id}`} className="card" style={{padding:16,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
                <div>
                  <div style={{fontWeight:700}}>{o.id}</div>
                  <div style={{fontSize:13,color:'var(--text-muted)'}}>{new Date(o.createdAt).toLocaleDateString('id-ID')} · {o.items.length} item</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontWeight:700,color:'var(--brand)'}}>{fmtRp(o.total)}</div>
                  <div style={{fontSize:12.5,color:'var(--text-muted)'}}>{STATUS_STEPS[o.statusIdx]}</div>
                </div>
              </a>
            ))}
          </div>
        )
      )}

      {tab==='favorites' && (
        favProducts.length===0 ? <EmptyState icon="🤍" title="Belum ada favorit" desc="Tap ikon hati pada produk untuk menyimpannya di sini." action={<a href="#/menu" className="btn btn-primary">Jelajahi Menu</a>}/> :
        <div className="grid-products">{favProducts.map(p=><ProductCard key={p.id} product={p}/>)}</div>
      )}

      {tab==='profile' && (
        <div className="card" style={{padding:20,maxWidth:440}}>
          <div className="field" style={{marginBottom:14}}><label>Nama</label><input value={user.name} onChange={e=>updateProfile({name:e.target.value})}/></div>
          <div className="field" style={{marginBottom:14}}><label>Email</label><input value={user.email} disabled/></div>
          <div className="field" style={{marginBottom:14}}>
            <label>Alamat Tersimpan</label>
            <textarea rows="2" value={address} onChange={e=>setAddress(e.target.value)}/>
          </div>
          <button className="btn btn-primary btn-sm" onClick={()=>{updateProfile({address});toast('Profil diperbarui');}}>Simpan Perubahan</button>
        </div>
      )}
    </div>
  );
}

function Favorites(){
  const wish = useWish();
  const favProducts = PRODUCTS.filter(p=>wish.ids.includes(p.id));
  return (
    <div className="wrap" style={{padding:'32px 20px 60px'}}>
      <h1 style={{fontSize:28,marginBottom:20}}>Produk Favorit</h1>
      {favProducts.length===0 ? <EmptyState icon="🤍" title="Belum ada favorit" desc="Simpan produk yang kamu suka dengan menekan ikon hati." action={<a href="#/menu" className="btn btn-primary">Jelajahi Menu</a>}/> :
        <div className="grid-products">{favProducts.map(p=><ProductCard key={p.id} product={p}/>)}</div>}
    </div>
  );
}

          <p style={{display:'flex',gap:10}}><Icon name="clock" size={18}/> Setiap hari, 07.00 – 22.00 WIB</p>
          <p>📞 (031) 555-0182</p>
          <p>✉️ halo@ruangseduh.id</p>
        </div>
        <a href="https://maps.google.com" className="btn btn-primary" style={{marginTop:18}}>Dapatkan Petunjuk Arah</a>

      <div aria-hidden="true" style={{background:'var(--surface-2)',border:'1px solid var(--line)',borderRadius:16,minHeight:280,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',flexDirection:'column',gap:8}}>
        <Icon name="pin" size={30}/>
        <span style={{fontSize:13}}>Area peta (placeholder embed Google Maps)</span>
      </div>

function ContactPage(){
  const toast = useToast();
  const [form,setForm] = useState({name:'',email:'',subject:'',message:''});
  const [errors,setErrors] = useState({});
  const [sent,setSent] = useState(false);
  const submit = e=>{
    e.preventDefault();
    const err={};
    if(!form.name.trim()) err.name='Nama wajib diisi';
    if(!/^\S+@\S+\.\S+$/.test(form.email)) err.email='Format email tidak valid';
    if(!form.subject.trim()) err.subject='Subjek wajib diisi';
    if(!form.message.trim() || form.message.length<10) err.message='Pesan minimal 10 karakter';
    setErrors(err);
    if(Object.keys(err).length===0){ setSent(true); toast('Pesan terkirim!'); }
  };
  return (
    <div className="wrap" style={{padding:'32px 20px 60px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:30}}>
      <div>
        <h1 style={{fontSize:30,marginBottom:16}}>Hubungi Kami</h1>
        {sent ? (
          <EmptyState icon="✅" title="Pesan terkirim" desc="Tim kami akan membalas dalam 1x24 jam." action={<button className="btn btn-outline" onClick={()=>{setSent(false);setForm({name:'',email:'',subject:'',message:''});}}>Kirim Pesan Lain</button>}/>
        ):(
        <form onSubmit={submit} className="card" style={{padding:20}}>
          <div className={`field ${errors.name?'has-err':''}`} style={{marginBottom:12}}>
            <label htmlFor="ct-name">Nama</label>
            <input id="ct-name" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
            {errors.name && <div className="err">{errors.name}</div>}
          </div>
          <div className={`field ${errors.email?'has-err':''}`} style={{marginBottom:12}}>
            <label htmlFor="ct-email">Email</label>
            <input id="ct-email" type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
            {errors.email && <div className="err">{errors.email}</div>}
          </div>
          <div className={`field ${errors.subject?'has-err':''}`} style={{marginBottom:12}}>
            <label htmlFor="ct-subject">Subjek</label>
            <input id="ct-subject" value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value}))}/>
            {errors.subject && <div className="err">{errors.subject}</div>}
          </div>
          <div className={`field ${errors.message?'has-err':''}`} style={{marginBottom:16}}>
            <label htmlFor="ct-msg">Pesan</label>
            <textarea id="ct-msg" rows="4" value={form.message} onChange={e=>setForm(f=>({...f,message:e.target.value}))}/>
            {errors.message && <div className="err">{errors.message}</div>}
          </div>
          <button className="btn btn-primary btn-full" type="submit">Kirim Pesan</button>
        </form>
        )}
      </div>
      <div>
        <h2 style={{fontSize:20,marginBottom:14}}>Info Kontak</h2>
        <div style={{display:'flex',flexDirection:'column',gap:14,color:'var(--text-muted)',fontSize:14.5}}>
          <p>📞 (031) 555-0182</p>
          <p>✉️ halo@ruangseduh.id</p>
          <p style={{display:'flex',gap:10}}><Icon name="ig" size={17}/> @ruangseduh.id</p>
          <p style={{display:'flex',gap:10}}><Icon name="pin" size={17}/> Jl. Darmo Permai III No. 12, Surabaya</p>
          <p style={{display:'flex',gap:10}}><Icon name="clock" size={17}/> Setiap hari, 07.00 – 22.00 WIB</p>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   APP SHELL
--------------------------------------------------------- */
function Page(){
  const route = useRoute();
  const [search,setSearch] = useState('');
  let content;
  switch(route.page){
    case 'home': content = <Home/>; break;
    case 'menu': content = <Menu search={search} setSearch={setSearch}/>; break;
    case 'product': content = <ProductDetail id={route.param}/>; break;
    case 'cart': content = <CartPage/>; break;
    case 'checkout': content = <Checkout/>; break;
    case 'tracking': content = <Tracking id={route.param}/>; break;
    case 'promo': content = <PromoPage/>; break;
    case 'about': content = <About/>; break;
    case 'blog': content = route.param ? <BlogDetail id={route.param}/> : <Blog/>; break;
    case 'reviews': content = <ReviewsPage/>; break;
    case 'login': content = <Login/>; break;
    case 'register': content = <Register/>; break;
    case 'forgot': content = <Forgot/>; break;
    case 'profile': content = <Profile/>; break;
    case 'favorites': content = <Favorites/>; break;
    case 'location': content = <LocationPage/>; break;
    case 'contact': content = <ContactPage/>; break;
    default: content = <Home/>;
  }
  return (
    <>
      <NavBar search={search} setSearch={setSearch}/>
      <main style={{flex:1}}>{content}</main>
      <Footer/>
    </>
  );
}

function App(){
  return (
    <ToastProvider>
      <UserProvider>
        <CartProvider>
          <WishProvider>
            <Page/>
          </WishProvider>
        </CartProvider>
      </UserProvider>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
